services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: skill_mentor_v2
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8085:8081"]
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=skill_mentor_v2;Username=${DB_USERNAME:-postgres};Password=${DB_PASSWORD:-password}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on: [db]
volumes:
  postgres_data:
